<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements | Berrien County MCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F5F0;--ink:#16181D;--navy:#14264D;--gold:#BF9E4C;--mut:#5A6172;--line:#DAD6CC;
--serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding:0 22px 60px}
header{padding:44px 0 0;text-align:center}
h1{font:700 clamp(24px,5vw,34px)/1.15 var(--serif);color:var(--navy);margin:0}
.mastrule{margin:20px auto 0;max-width:340px;border-top:2.5px solid var(--navy);position:relative}
.mastrule::after{content:"";position:absolute;left:0;right:0;top:3px;border-top:1px solid var(--gold)}
.lede{margin:18px auto 0;max-width:56ch;font-size:14px;color:var(--mut)}
.notice{margin:30px 0 0;padding:0 0 24px;border-bottom:1px solid var(--line)}
.notice .nd{font:700 12px/1 var(--mono);color:var(--gold);letter-spacing:.05em}
.notice h2{font:600 21px/1.3 var(--serif);color:var(--navy);margin:8px 0 8px}
.notice p{margin:0;font-size:15px;max-width:62ch}
a.back{display:inline-block;margin:34px 0 0;color:var(--navy);font-size:14px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Announcements</h1>
  <div class="mastrule"></div>
  <p class="lede">Official notices from the Berrien County Medical Control Authority.
  Protocol actions, implementation dates, and system changes are recorded here as of
  the date shown.</p>
</header>
<main id="list"></main>
<a class="back" href="/">&larr; Berrien County MCA</a>
</div>
<script>
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
fetch('announcements.json').then(r=>r.json()).then(items=>{
  items.sort((a,b)=>b.d.localeCompare(a.d));
  document.getElementById('list').innerHTML=items.map(n=>
    `<article class="notice"><span class="nd">${fmt(n.d).toUpperCase()}</span>
     <h2>${n.t}</h2><p>${n.b}${n.a?` <a href="${n.a}">Attachment (PDF)</a>`:''}</p></article>`).join('');
});
</script>
</body>
</html>
